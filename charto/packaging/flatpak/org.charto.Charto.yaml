# Flatpak manifest for Charto. Build and install with packaging/flatpak/build-flatpak.sh
#
# The application id below is a placeholder. For Flathub it must belong to a domain or
# code-hosting account you control (for example io.github.<your-user>.Charto); if you change
# it, rename org.charto.Charto.metainfo.xml and the install lines below to match.
app-id: org.charto.Charto
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: charto

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # No filesystem access is requested: the open/save dialogs and printing go through the
  # desktop portals, which hand the sandbox exactly the files the user picks.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/charto/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: charto
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose -p charto-app
      - install -Dm755 target/release/charto /app/bin/charto
      - mkdir -p /app/share/charto
      - cp -r assets/symbols /app/share/charto/symbols
      - sed 's/^Icon=charto$/Icon=org.charto.Charto/' packaging/charto.desktop > org.charto.Charto.desktop
      - install -Dm644 org.charto.Charto.desktop /app/share/applications/org.charto.Charto.desktop
      - install -Dm644 packaging/charto.svg /app/share/icons/hicolor/scalable/apps/org.charto.Charto.svg
      - install -Dm644 packaging/charto-mime.xml /app/share/mime/packages/org.charto.Charto.xml
      - install -Dm644 packaging/flatpak/org.charto.Charto.metainfo.xml /app/share/metainfo/org.charto.Charto.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - .git
      - cargo-sources.json
